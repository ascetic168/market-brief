<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>__TITLE_TAG__</title>
<style>
  :root{
    --primary:#496573; --accent:#a22c40; --text:#151617; --muted:#757c7f;
    --bg:#f4f5f5; --card:#ffffff; --stripe:#eaeced; --border:#c7d3d9;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0;background:var(--bg);color:var(--text);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
       font-size:16px;line-height:1.7}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  header{border-bottom:3px solid var(--primary);padding-bottom:14px;margin-bottom:22px}
  .kicker{color:var(--muted);font-size:.85rem;letter-spacing:.25em;font-weight:600}
  h1{font-size:1.9rem;margin:.2em 0 .3em;color:var(--primary);line-height:1.3}
  .meta{color:var(--muted);font-size:.9rem}
  .summary{background:var(--card);border-left:5px solid var(--accent);padding:14px 18px;
           margin:18px 0 8px;font-size:1rem}
  section{margin-top:34px}
  h2{font-size:1.3rem;color:var(--primary);border-left:5px solid var(--primary);
     padding-left:10px;margin:0 0 12px}
  p{margin:.5em 0}
  .cards{display:flex;gap:14px;flex-wrap:wrap}
  .card{flex:1 1 220px;background:var(--card);border:1px solid var(--border);
        border-top:4px solid var(--primary);padding:14px 16px;text-align:center}
  .card-label{color:var(--muted);font-size:.9rem;font-weight:600}
  .card-sym{color:var(--muted);font-size:.78rem;font-weight:400;margin-left:6px}
  .card-num{font-size:1.85rem;font-weight:700;color:var(--text);margin:.1em 0}
  .card-chg{font-size:1.05rem;font-weight:700}
  .card-range{color:var(--muted);font-size:.8rem;margin-top:.3em}
  table{width:100%;border-collapse:collapse;background:var(--card);margin:10px 0 4px;
        font-size:.95rem}
  th{background:var(--primary);color:#fff;padding:9px 10px;font-weight:600;text-align:center}
  td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:nth-child(even){background:var(--stripe)}
  .c-name{font-weight:700}
  .c-sym{color:var(--muted);font-size:.8rem;font-weight:400;margin-left:8px}
  .c-group{color:var(--muted);font-size:.85rem;text-align:center}
  .c-num{text-align:right;font-variant-numeric:tabular-nums}
  .caption{color:var(--muted);font-size:.82rem;text-align:center;margin:4px 0 0}
  .sparks{display:grid;grid-template-columns:1fr;gap:14px}
  .spark-card{background:var(--card);border:1px solid var(--border);padding:12px 16px 8px}
  .spark-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
  .spark-title{font-weight:700;color:var(--primary)}
  .spark-now{font-size:1.05rem;font-variant-numeric:tabular-nums}
  svg{width:100%;height:auto;display:block}
  .svghi{font-size:12px;fill:var(--text);font-weight:700}
  .svglo{font-size:12px;fill:var(--muted)}
  .spark-foot{color:var(--muted);font-size:.8rem;margin-top:4px}
  ul,ol{padding-left:1.4em;margin:.4em 0}
  li{margin:.45em 0}
  .up{color:#c0392b}.down{color:#1e7a46}
  .quotebox{background:var(--card);border-left:4px solid var(--accent);padding:12px 16px;margin:14px 0}
  .quotebox .attr{color:var(--muted);font-size:.85rem;margin-top:6px}
  table.stage td:first-child{font-weight:700;white-space:nowrap}
  table.stage td:nth-child(3){white-space:nowrap}
  .note{background:var(--stripe);border:1px dashed var(--border);padding:10px 14px;
        color:var(--muted);font-size:.88rem;margin:12px 0}
  .src li{font-size:.9rem;color:var(--muted)}
  .src a{color:var(--primary);word-break:break-all}
  footer{margin-top:40px;border-top:1px solid var(--border);padding-top:14px;
         color:var(--muted);font-size:.85rem}
  @page{size:A4;margin:13mm 11mm}
  @media print{
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    section{break-before:page}
    section.first{break-before:auto}
    section:last-of-type{break-before:auto}
    header{break-inside:avoid}
    .summary{break-inside:avoid}
    .card,.spark-card,table{break-inside:avoid}
    .sparks{break-inside:avoid}
    footer{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="kicker">經濟循環研究 · 收盤快報 CLOSING BRIEF</div>
  <h1>__TITLE__</h1>
  <div class="meta">__META_LINE__</div>
  <div class="summary">
__SUMMARY_HTML__
  </div>
</header>

__SECTIONS_HTML__

<footer>
__FOOTER_HTML__
</footer>

</div>
</body>
</html>
