name: Cloud pipeline smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_BASE_URL: https://open.bigmodel.cn/api/paas/v4/chat/completions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Probe 0 — LLM_API_TOKEN + endpoint + model discovery
        id: probe0
        env:
          LLM_API_TOKEN: ${{ secrets.LLM_API_TOKEN }}
        run: |
          if [ -z "$LLM_API_TOKEN" ]; then
            echo "::error::LLM_API_TOKEN is EMPTY — set the secret first (gh secret set LLM_API_TOKEN)"
            exit 1
          fi
          FOUND=""
          for M in glm-5.3 glm-5 glm-4.6 glm-4.5 glm-4.5-air glm-4-flash; do
            CODE=$(curl -s -o /tmp/chat.json -w "%{http_code}" \
              -H "Authorization: Bearer $LLM_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":5}" \
              "$LLM_BASE_URL")
            echo "model $M -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then FOUND="$M"; break; fi
            head -c 200 /tmp/chat.json; echo
          done
          if [ -z "$FOUND" ]; then
            echo "::error::no working model on this key/endpoint"
            exit 1
          fi
          echo "WORKING_MODEL=$FOUND" >> "$GITHUB_OUTPUT"
          echo "confirmed model: $FOUND"

      - name: Probe 1 — Yahoo Finance from runner
        run: python scripts/fetch_us.py

      - name: Probe 2 — news sources from runner
        run: python scripts/fetch_news.py us

      - name: Probe 3 — full generation to /tmp
        env:
          LLM_API_TOKEN: ${{ secrets.LLM_API_TOKEN }}
          LLM_MODEL: ${{ steps.probe0.outputs.WORKING_MODEL }}
        run: |
          python scripts/gen_report_cloud.py us data/us_20261109.json data/news_us_20261110.json --out-dir /tmp/smoke

      - name: Inspect generated HTML
        run: |
          echo "--- head ---"
          head -c 1200 /tmp/smoke/index.html
          echo
          echo "--- structure ---"
          grep -o "<h2>[^<]*</h2>" /tmp/smoke/index.html || echo "(no h2 found)"
          grep -c "spark-card" /tmp/smoke/index.html || true
          echo "--- size ---"
          wc -c /tmp/smoke/index.html
