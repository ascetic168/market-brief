<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Market Brief 每日市場快報</title>
<meta name="description" content="美股與台股盤後收盤報告，每個交易日自動產出。"/>
<style>
  :root{
    --primary:#496573; --accent:#a22c40; --text:#151617; --muted:#757c7f;
    --bg:#f4f5f5; --card:#ffffff; --stripe:#eaeced; --border:#c7d3d9;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0;background:var(--bg);color:var(--text);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
       font-size:16px;line-height:1.7}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  header.site{border-bottom:3px solid var(--primary);padding-bottom:14px;margin-bottom:22px;
              display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
  .kicker{color:var(--muted);font-size:.85rem;letter-spacing:.25em;font-weight:600}
  h1.site{font-size:1.9rem;margin:.2em 0 .3em;color:var(--primary);line-height:1.3}
  .site-sub{color:var(--muted);font-size:.95rem}
  .gh{font-size:.85rem}
  .gh a{color:var(--primary);text-decoration:none;border-bottom:1px dotted var(--border)}
  h2.block{font-size:1.3rem;color:var(--primary);border-left:5px solid var(--primary);
           padding-left:10px;margin:30px 0 14px}
  .latest{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .latest-card{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--primary);
               padding:16px 18px;cursor:pointer;transition:box-shadow .15s}
  .latest-card:hover{box-shadow:0 2px 10px rgba(21,22,23,.12)}
  .latest-card.active{border-top-color:var(--accent)}
  .mkt-tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.15em;
           color:#fff;background:var(--primary);padding:2px 10px;border-radius:2px}
  .mkt-tag.tw{background:#a22c40}
  .mkt-tag.special{background:#757c7f}
  .latest-date{color:var(--muted);font-size:.85rem;margin-left:8px}
  .latest-title{font-size:1.15rem;font-weight:700;margin:.35em 0 .2em}
  .latest-summary{color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;
                  -webkit-box-orient:vertical;overflow:hidden}
  .open-hint{color:var(--primary);font-size:.85rem;margin-top:8px;font-weight:600}
  .viewer{background:var(--card);border:1px solid var(--border);margin-top:6px}
  .viewer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;
              padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .viewer-title{font-weight:700;color:var(--primary)}
  .viewer-link{font-size:.85rem;color:var(--primary);text-decoration:none;
               border-bottom:1px dotted var(--border)}
  #frame{width:100%;height:78vh;border:0;display:block;background:#fff}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filter{background:var(--card);border:1px solid var(--border);color:var(--muted);
          font-size:.9rem;font-weight:600;padding:6px 16px;cursor:pointer;
          font-family:inherit;border-radius:2px}
  .filter.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .searchbox{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
  #q{flex:1 1 260px;min-width:220px;padding:8px 12px;border:1px solid var(--border);
     font-family:inherit;font-size:.95rem;border-radius:2px;background:var(--card);color:var(--text)}
  #q:focus{outline:2px solid var(--primary);outline-offset:-1px}
  .count{color:var(--muted);font-size:.85rem;white-space:nowrap}
  .month{color:var(--primary);font-size:1rem;font-weight:700;margin:18px 0 6px}
  ul.archive{list-style:none;margin:0;padding:0}
  ul.archive li{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);
                margin:6px 0;padding:10px 14px;cursor:pointer;transition:box-shadow .15s;
                display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  ul.archive li:hover{box-shadow:0 2px 8px rgba(21,22,23,.10)}
  ul.archive li.active{border-left-color:var(--accent)}
  .a-date{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .a-body{flex:1 1 260px;min-width:0}
  .a-title{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden}
  .a-summary{color:var(--muted);font-size:.85rem;line-height:1.55;margin-top:3px;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .empty{color:var(--muted);background:var(--stripe);border:1px dashed var(--border);
         padding:14px 16px;font-size:.9rem}
  .load-more{display:block;margin:16px auto 0;padding:8px 22px;background:var(--card);
             border:1px solid var(--border);color:var(--primary);font-weight:700;
             font-size:.9rem;cursor:pointer;font-family:inherit;border-radius:2px}
  .load-more:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(21,22,23,.10)}
  footer.site{margin-top:40px;border-top:1px solid var(--border);padding-top:14px;
              color:var(--muted);font-size:.85rem}
  @media (max-width:640px){ #frame{height:65vh} }
</style>
</head>
<body>
<div class="wrap">

<header class="site">
  <div>
    <div class="kicker">經濟循環研究 · 收盤快報 CLOSING BRIEF</div>
    <h1 class="site">Market Brief 每日市場快報</h1>
    <div class="site-sub">美股（台北時間週二至週六 05:30）· 台股（週一至週五 13:40）· 收盤定案後自動發布</div>
  </div>
  <div class="gh"><a href="https://github.com/ascetic168/market-brief" target="_blank" rel="noopener">GitHub Repository ↗</a></div>
</header>

<h2 class="block">最新報告</h2>
<div class="latest" id="latest"></div>

<h2 class="block">報告閱讀</h2>
<div class="viewer">
  <div class="viewer-bar">
    <div class="viewer-title" id="viewer-title">—</div>
    <a class="viewer-link" id="viewer-open" href="#" target="_blank" rel="noopener">在新視窗開啟 ↗</a>
  </div>
  <iframe id="frame" title="報告內容" src="about:blank"></iframe>
</div>

<h2 class="block">歷史封存</h2>
<div class="searchbox">
  <input type="search" id="q" aria-label="搜尋報告"
         placeholder="搜尋標題、摘要或日期（例：護盤、限空令、台積電、11/11）"/>
  <span class="count" id="count"></span>
</div>
<div class="filters" id="filters">
  <button class="filter on" data-mkt="all">全部</button>
  <button class="filter" data-mkt="us">美股</button>
  <button class="filter" data-mkt="tw">台股</button>
  <button class="filter" data-mkt="special">專題</button>
</div>
<div id="archive"></div>

<footer class="site">
  本站報告僅供資訊與研究目的，<b>不構成投資建議</b>。資料來源：Yahoo Finance、臺灣證券交易所；
  各報告之新聞來源標註於文內「資料來源」章節。由本地排程自動生成並發布。
</footer>

</div>
<script>
"use strict";
var MKT_LABEL = {us:"美股", tw:"台股", special:"專題"};
var reports = [];
var curFilter = "all";
var curFile = null;
var curQ = "";
/* 封存預設只展開最新 PAGE 篇，其餘靠「載入更多」；搜尋/過濾仍覆蓋全部。
   ?page=N 可覆寫（營運檢查用）。 */
var PAGE = (function(){
  var m = location.search.match(/[?&]page=(\d+)/);
  return m ? Math.max(3, parseInt(m[1], 10)) : 30;
})();
var curShown = PAGE;

function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}
/* 正規化：只留英數與 CJK——「11/11」「1111」「2026-11-11」皆可比對日期 */
function norm(s){
  return String(s).toLowerCase().replace(/[^0-9a-z\u3400-\u9fff]/gi, "");
}
function applyActive(){
  var els = document.querySelectorAll(".latest-card, #archive li");
  for (var i=0;i<els.length;i++)
    els[i].classList.toggle("active", els[i].getAttribute("data-file")===curFile);
}
function byMarket(mkt){
  return reports.filter(function(r){ return r.market === mkt; })
                .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}
function show(file, title){
  curFile = file;
  document.getElementById("frame").src = file;
  document.getElementById("viewer-title").textContent = title;
  document.getElementById("viewer-open").href = file;
  var cards = document.querySelectorAll(".latest-card");
  for (var i=0;i<cards.length;i++) cards[i].classList.toggle("active", cards[i].getAttribute("data-file")===file);
  var items = document.querySelectorAll("#archive li");
  for (var j=0;j<items.length;j++) items[j].classList.toggle("active", items[j].getAttribute("data-file")===file);
  if (window.scrollIntoViewIfNeeded) {}
}
function buildLatest(){
  var box = document.getElementById("latest");
  box.innerHTML = "";
  var picks = [];
  ["us","tw"].forEach(function(m){
    var list = byMarket(m);
    if (list.length) picks.push(list[0]);
  });
  picks.forEach(function(r){
    var c = el("div","latest-card");
    c.setAttribute("data-file", r.file);
    c.innerHTML = '<span class="mkt-tag ' + r.market + '">' + MKT_LABEL[r.market] + '</span>' +
      '<span class="latest-date">' + r.date + ' 收盤定案</span>' +
      '<div class="latest-title">' + esc(r.title) + '</div>' +
      '<div class="latest-summary">' + esc(r.summary) + '</div>' +
      '<div class="open-hint">點擊閱讀全文 ↓</div>';
    c.addEventListener("click", function(){ show(r.file, r.title); });
    box.appendChild(c);
  });
}
function buildArchive(){
  var box = document.getElementById("archive");
  box.innerHTML = "";
  var q = norm(curQ);
  var list = reports.filter(function(r){
      if (curFilter!=="all" && r.market!==curFilter) return false;
      return !q || (r.needle && r.needle.indexOf(q) !== -1);
    })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var shown = list.slice(0, curShown);
  var count = document.getElementById("count");
  var suffix = list.length > shown.length ? "（顯示最新 " + shown.length + " 篇）" : "";
  var term = curQ.trim();
  if (term){
    count.textContent = "符合「" + term + "」：" + list.length + " 筆" + suffix;
    if (!list.length){
      box.appendChild(el("div","empty",
        "找不到符合「" + esc(term) + "」的報告。試試其他關鍵字，例如：護盤、限空令、台積電、11/11。"));
      return;
    }
  } else {
    count.textContent = "共 " + list.length + " 篇" + suffix;
    if (!list.length){ box.appendChild(el("div","empty","此分類尚無報告。")); return; }
  }
  var monthBox = null, monthKey = "";
  shown.forEach(function(r){
    var key = r.date.slice(0,7);
    if (key !== monthKey){
      monthKey = key;
      monthBox = el("div");
      monthBox.appendChild(el("div","month", key.replace("-"," 年 ") + " 月"));
      var ul = el("ul","archive");
      monthBox.appendChild(ul);
      box.appendChild(monthBox);
    }
    var li = el("li");
    li.setAttribute("data-file", r.file);
    li.innerHTML = '<span class="a-date">' + r.date + '</span>' +
      '<span class="mkt-tag ' + r.market + '">' + MKT_LABEL[r.market] + '</span>' +
      '<div class="a-body"><div class="a-title">' + esc(r.title) + '</div>' +
      (r.summary ? '<div class="a-summary">' + esc(r.summary) + '</div>' : '') +
      '</div>';
    li.addEventListener("click", function(){ show(r.file, r.title); });
    monthBox.querySelector("ul").appendChild(li);
  });
  if (list.length > shown.length){
    var more = el("button","load-more","載入更多（尚餘 " + (list.length - shown.length) + " 篇）");
    more.addEventListener("click", function(){
      curShown += PAGE;
      buildArchive();
    });
    box.appendChild(more);
  }
  applyActive();
}
document.getElementById("filters").addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest(".filter") : null;
  if (!b) return;
  curFilter = b.getAttribute("data-mkt");
  curShown = PAGE;
  var fs = document.querySelectorAll(".filter");
  for (var i=0;i<fs.length;i++) fs[i].classList.toggle("on", fs[i]===b);
  buildArchive();
});
document.getElementById("q").addEventListener("input", function(){
  curQ = this.value;
  curShown = PAGE;
  buildArchive();
});
/* Escape／原生清除鈕在部分瀏覽器只發 search 事件，一併監聽 */
document.getElementById("q").addEventListener("search", function(){
  curQ = this.value;
  curShown = PAGE;
  buildArchive();
});
fetch("manifest.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(m){
    reports = m.reports || [];
    reports.forEach(function(r){
      r.needle = norm((r.title||"") + " " + (r.summary||"") + " " + (r.date||"") + " " + (MKT_LABEL[r.market]||""));
    });
    buildLatest();
    buildArchive();
    var prio = {us:0, tw:1, special:2};
    var newest = reports.slice().sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return prio[a.market] - prio[b.market];
    })[0];
    if (newest) show(newest.file, newest.title);
  })
  .catch(function(e){
    document.getElementById("latest").innerHTML =
      '<div class="empty">無法載入 manifest.json（' + e.message + '）。若以本機檔案開啟，請透過 HTTP 伺服器瀏覽。</div>';
  });
</script>
</body>
</html>
